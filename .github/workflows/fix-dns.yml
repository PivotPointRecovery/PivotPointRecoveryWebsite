name: Repoint apex DNS to Cloudflare Pages

# Fixes Cloudflare Error 1000 ("DNS points to prohibited IP") on
# pivotpointrecovery.org.
#
# The apex and www records currently hold Cloudflare's OWN anycast addresses,
# so the proxy resolves to itself and every request 403s. Cloudflare also
# refuses to attach a Pages custom domain while a conflicting A/AAAA record
# exists, so those records must go first.
#
# SAFETY DESIGN — this workflow defaults to a dry run.
#   * mode=plan  (default) prints exactly what it would change and exits.
#   * mode=apply performs the change.
# It only ever deletes A/AAAA records on the apex and www whose contents fall
# inside Cloudflare's own published IP ranges. MX, TXT, SPF/DKIM, and every
# other record type is untouched, so email and domain verification are safe.
#
# Run 'plan' first, read the output, then run 'apply'.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan = show changes only; apply = make them"
        required: true
        default: plan
        type: choice
        options: [plan, apply]

permissions:
  contents: read

concurrency:
  group: cloudflare-dns
  cancel-in-progress: false

env:
  ZONE_NAME: pivotpointrecovery.org
  PROJECT_NAME: pivotpointrecovery

jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Cloudflare credentials
        env:
          T1: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          T2: ${{ secrets.CF_API_TOKEN }}
          T3: ${{ secrets.CLOUDFLARE_TOKEN }}
          A1: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          A2: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          TOKEN=""
          for c in "$T1" "$T2" "$T3"; do
            if [ -n "$c" ]; then TOKEN="$c"; break; fi
          done
          if [ -z "$TOKEN" ]; then
            echo "::error::No Cloudflare API token secret found."
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"
          ACCT=""
          for c in "$A1" "$A2"; do
            if [ -n "$c" ]; then ACCT="$c"; break; fi
          done
          if [ -n "$ACCT" ]; then echo "::add-mask::$ACCT"; fi
          echo "ACCT=$ACCT" >> "$GITHUB_ENV"

      - name: Resolve zone and account
        run: |
          set -euo pipefail
          api() { curl -sS -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' "$@"; }

          if [ -z "${ACCT:-}" ]; then
            a=$(api "https://api.cloudflare.com/client/v4/accounts?per_page=50")
            [ "$(echo "$a" | jq -r '.result|length')" = "1" ] || { echo "::error::Set CLOUDFLARE_ACCOUNT_ID."; exit 1; }
            ACCT=$(echo "$a" | jq -r '.result[0].id')
            echo "::add-mask::$ACCT"
            echo "ACCT=$ACCT" >> "$GITHUB_ENV"
          fi

          z=$(api "https://api.cloudflare.com/client/v4/zones?name=$ZONE_NAME")
          [ "$(echo "$z" | jq -r '.result|length')" = "1" ] || { echo "::error::Zone $ZONE_NAME not accessible with this token (needs Zone:DNS:Edit)."; exit 1; }
          ZID=$(echo "$z" | jq -r '.result[0].id')
          echo "::add-mask::$ZID"
          echo "ZID=$ZID" >> "$GITHUB_ENV"
          echo "Zone resolved. status=$(echo "$z" | jq -r '.result[0].status')"

      - name: Identify the offending records
        run: |
          set -euo pipefail
          api() { curl -sS -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' "$@"; }

          api "https://api.cloudflare.com/client/v4/zones/$ZID/dns_records?per_page=200" > all.json
          curl -sS https://www.cloudflare.com/ips-v4 -o v4.txt
          curl -sS https://www.cloudflare.com/ips-v6 -o v6.txt

          python3 - <<'PY'
          import ipaddress, json, os
          zone = os.environ['ZONE_NAME']
          nets = []
          for f in ('v4.txt', 'v6.txt'):
              for line in open(f):
                  line = line.strip()
                  if line:
                      nets.append(ipaddress.ip_network(line))

          recs = json.load(open('all.json'))['result']
          targets = {zone, 'www.' + zone}
          doomed, keep = [], []
          for r in recs:
              if r['name'] in targets and r['type'] in ('A', 'AAAA'):
                  try:
                      ip = ipaddress.ip_address(r['content'])
                  except ValueError:
                      continue
                  if any(ip in n for n in nets):
                      doomed.append(r)
                  else:
                      keep.append(r)

          print("== Records on apex/www that point into Cloudflare's own ranges ==")
          print("   (these are the cause of Error 1000 and would be REMOVED)")
          for r in doomed:
              print(f"   DELETE  {r['type']:5} {r['name']}  ->  {r['content']}")
          if not doomed:
              print("   (none — Error 1000 may already be resolved)")

          if keep:
              print("\n== Real origin records on apex/www — NOT touched ==")
              for r in keep:
                  print(f"   KEEP    {r['type']:5} {r['name']}  ->  {r['content']}")

          others = [r for r in recs if not (r['name'] in targets and r['type'] in ('A','AAAA'))]
          print(f"\n== {len(others)} other records (MX/TXT/CNAME/etc) — NOT touched ==")

          with open(os.environ['GITHUB_ENV'], 'a') as fh:
              fh.write('DOOMED_IDS=' + ','.join(r['id'] for r in doomed) + '\n')
          PY

      - name: Plan only — stop here
        if: inputs.mode == 'plan'
        run: |
          echo "mode=plan, so nothing was changed."
          echo "Re-run this workflow with mode=apply to remove the records above"
          echo "and attach $ZONE_NAME to the '$PROJECT_NAME' Pages project."

      - name: Apply — remove offending records
        if: inputs.mode == 'apply'
        run: |
          set -euo pipefail
          api() { curl -sS -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' "$@"; }
          if [ -z "${DOOMED_IDS:-}" ]; then
            echo "Nothing to delete."
          else
            IFS=',' read -ra ids <<< "$DOOMED_IDS"
            for id in "${ids[@]}"; do
              [ -n "$id" ] || continue
              out=$(api -X DELETE "https://api.cloudflare.com/client/v4/zones/$ZID/dns_records/$id")
              ok=$(echo "$out" | jq -r '.success')
              echo "  deleted record: success=$ok"
              [ "$ok" = "true" ] || { echo "$out" | jq -r '.errors[]?|"  "+.message'; exit 1; }
            done
          fi

      - name: Apply — attach custom domains to the Pages project
        if: inputs.mode == 'apply'
        run: |
          set -euo pipefail
          api() { curl -sS -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' "$@"; }
          for host in "$ZONE_NAME" "www.$ZONE_NAME"; do
            echo "Attaching $host ..."
            out=$(api -X POST \
              "https://api.cloudflare.com/client/v4/accounts/$ACCT/pages/projects/$PROJECT_NAME/domains" \
              --data "{\"name\":\"$host\"}")
            if [ "$(echo "$out" | jq -r '.success')" = "true" ]; then
              echo "  attached."
            else
              # 8000000-series "already exists" is fine and idempotent.
              echo "$out" | jq -r '.errors[]? | "  " + (.code|tostring) + ": " + .message'
            fi
          done

      - name: Apply — verify the site is actually up
        if: inputs.mode == 'apply'
        run: |
          echo "Waiting for https://$ZONE_NAME/ to serve (DNS + cert can take a few minutes)..."
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "https://$ZONE_NAME/" || echo 000)
            echo "  attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then echo "SITE IS UP: https://$ZONE_NAME/"; exit 0; fi
            sleep 20
          done
          echo "::warning::Not serving 200 yet. A brand-new custom domain can take up to ~15 minutes for its certificate to issue; re-check before assuming failure."
